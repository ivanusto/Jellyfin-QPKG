name: Build QPKG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a full commit SHA with the version in a comment,
# and QDK to a commit, so a build is reproducible from the same inputs.
env:
  QDK_REF: "b7b5f4c86ebe95b10a62d64725515e7cdcf4bb35"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install QDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc libc6-dev rsync xz-utils dos2unix
          git init -q /tmp/QDK
          cd /tmp/QDK
          git remote add origin https://github.com/qnap-dev/QDK.git
          git fetch -q --depth 1 origin "$QDK_REF"
          git checkout -q FETCH_HEAD
          sudo ./InstallToUbuntu.sh install

      - name: Normalize line endings
        run: |
          find . -type f \( -name '*.sh' -o -name 'package_routines' -o -name 'qpkg.cfg' \) -exec dos2unix {} +

      # The repository keeps QPKG_VER="latest"; the tag is the version.
      - name: Set QPKG version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^QPKG_VER=.*/QPKG_VER=\"${VERSION}\"/" qpkg.cfg
          grep '^QPKG_VER=' qpkg.cfg

      - name: Build QPKG
        run: |
          export PATH="/usr/share/QDK/bin:$PATH"
          qbuild

      - name: Checksums
        run: |
          cd build
          sha256sum *.qpkg > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: build/*.qpkg

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jellyfin-qpkg
          path: |
            build/*.qpkg
            build/SHA256SUMS

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/*.qpkg
            build/SHA256SUMS
          generate_release_notes: true
